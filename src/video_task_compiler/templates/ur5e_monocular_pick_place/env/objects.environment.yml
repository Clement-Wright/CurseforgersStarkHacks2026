# Grounded-SAM-2 is expected as an external local checkout. This environment
# covers only the repo-side runtime needed to normalize and serialize delta
# artifacts around that checkout.
name: video-task-compiler-objects
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - numpy
  - pillow
  - pyarrow
  - pycocotools
  - pydantic
  - pyyaml
  - typer
  - pip:
      - torch
      - torchvision
