schema_version: 0.1.0
project_name: monocular_video_to_robot_frontend
video_id: demo_0001
sample_raw_video: video/raw/demo_0001.mp4
task_name: pick_and_place_single_object
demo_owner: robotics-team
artifact_owners:
  alpha: tech-lead
  beta: sfm-lead
  gamma: perception-lead
  delta: simulation-lead
  epsilon: geometry-lead
  zeta: asset-lead
  eta: controls-lead
  theta: sim-lead
  deployment: controls-lead
robot_target_id: ur5e_robotiq_2f85
capture:
  require_static_preroll: true
  preroll_seconds: 10.0
  postroll_seconds: 0.0
  operator_count: 1
coord_frames:
  project_world: W
  robot_base: Br
  camera_optical: Ci
time:
  origin: first_decoded_frame
  base_unit: ns
world_frame_policy: fiducial_center
metric_scale_policy: fiducial_marker
gamma:
  primary_backbone: fourdhumans
  export_world_estimates_when_available: true
  active_segment_policy: non_preroll
  overlay_sample_count: 20
  smoothing:
    method: moving_average
    window_size: 5
delta:
  primary_backbone: grounded_sam2
  annotation_frame_policy: best_preroll_then_active
  track_scope: ontology_only
  overlay_sample_count: 20
  interaction:
    contact_distance_px: 20
    wrist_confidence_floor: 0.5
  mask_encoding: coco_rle
epsilon:
  primary_backbone: artifact_fusion
  geometry_mode: proxy_scene
  metric_alignment_mode: inherited_from_beta
  preserve_beta_world: true
  metric_world_frame: M
  support_plane_source: task_region_prior
  default_object_height_m: 0.04
  qc_overlay_frame_count: 12
zeta:
  primary_backbone: mujoco_safe_assets
  asset_mode: proxy_visual_and_collision
  collision_strategy: obb_single
  max_collision_geoms_per_object: 1
  require_mujoco_compile: true
eta:
  primary_backbone: arm_gripper_waypoint_replay
  execution_mode: arm_gripper_waypoint_replay
  retarget_mode: planar_pick_place
  ik_backend: pinocchio_seed
  pregrasp_clearance_m: 0.08
  transport_clearance_m: 0.12
  postplace_clearance_m: 0.08
  waypoint_hold_s: 0.25
  hdf5_export_policy: best_effort
theta:
  primary_backbone: canonical_mujoco_task
  compile_backend: xml_tree_compiler
  sim_world_frame: M
  robot_model_source: vendored_local_copy
  human_ghost_mode: arm_observables
ontology:
  target_object_id: target_object
  receptacle_object_id: receptacle
  support_surface_id: tabletop
sponsor_resources:
  - rgb_monocular_capture
  - colmap_gpu_node
  - ur5e_workcell
acceptance:
  beta_min_registered_fraction: 0.7
  beta_min_registered_keyframes: 20
  beta_max_mean_reprojection_error_px: 3.0
  gamma_min_primary_track_fraction: 0.95
  gamma_min_median_wrist_confidence: 0.5
  gamma_max_id_switches: 1
  delta_require_all_ontology_entities_tracked: true
  delta_max_duplicate_ids_in_review_sample: 0
  delta_min_mask_iou_sample: 0.8
  delta_require_rle_decode_success: true
  epsilon_require_truthful_provenance: true
  epsilon_max_support_plane_rmse_m: 0.01
  epsilon_max_scale_anchor_rel_error: 0.05
  zeta_require_mujoco_compile: true
  zeta_require_passive_smoke: true
  zeta_max_collision_geoms_per_object: 4
  eta_min_demo_frames: 8
  eta_min_ik_solve_rate: 0.95
  eta_max_joint_step_rad: 0.35
  theta_require_scene_compile: true
  theta_require_mjb_load: true
  theta_zero_control_smoke_steps: 16
  theta_trace_smoke_steps: 8
  theta_require_audit_render: true
  theta_require_robot_ghost_visible: true
  theta_require_human_ghost_visible: true
