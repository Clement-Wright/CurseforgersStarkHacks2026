[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-task-compiler"
version = "0.1.0"
description = "Phase alpha contract scaffold for a video-to-robot task compiler."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "av>=13,<18",
  "imageio>=2.34,<3",
  "imageio[ffmpeg]>=2.34,<3",
  "numpy>=1.26,<3",
  "opencv-contrib-python>=4.10,<5",
  "Pillow>=10,<13",
  "pycocotools>=2.0.8,<3",
  "pydantic>=2.7,<3",
  "pyarrow>=16,<21",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.22,<5",
  "pytest>=8,<9",
]

[project.scripts]
vtc = "video_task_compiler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_task_compiler = [
  "templates/**/*.yaml",
  "templates/**/*.yml",
  "templates/**/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
